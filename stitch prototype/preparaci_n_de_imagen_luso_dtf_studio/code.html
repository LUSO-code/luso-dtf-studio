<canvas id="shader-canvas-ANIMATION_3" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_3');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

// Simplex 2D noise
vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }

float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
           -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
  + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
    dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main() {
    vec2 uv = v_texCoord;
    float t = u_time * 0.15;
    
    // Create animated aurora-like layers
    float n1 = snoise(uv * 2.0 + t);
    float n2 = snoise(uv * 3.0 - t * 0.8);
    float n3 = snoise(uv * 4.0 + t * 1.2);
    
    // Define the vibrant palette stops
    vec3 deepViolet = vec3(0.18, 0.07, 0.45);
    vec3 electricPurple = vec3(0.55, 0.36, 0.96);
    vec3 magenta = vec3(0.9, 0.1, 0.6);
    vec3 cyan = vec3(0.0, 0.8, 0.9);
    vec3 warmOrange = vec3(1.0, 0.5, 0.2);
    
    // Mix based on noise and coordinates
    vec3 color = mix(deepViolet, electricPurple, 0.5 + 0.5 * n1);
    color = mix(color, magenta, smoothstep(0.1, 0.9, n2));
    color = mix(color, cyan, smoothstep(0.4, 1.0, n3) * 0.3);
    color = mix(color, warmOrange, smoothstep(0.7, 1.0, n1 * n2) * 0.2);
    
    // Add soft lighting orbs
    float orb = 1.0 - length(uv - vec2(0.8, 0.2 + 0.1 * sin(t)));
    color += mix(vec3(0.0), cyan, pow(max(0.0, orb), 4.0) * 0.5);
    
    float orb2 = 1.0 - length(uv - vec2(0.2, 0.8 + 0.1 * cos(t)));
    color += mix(vec3(0.0), magenta, pow(max(0.0, orb2), 4.0) * 0.4);
    
    gl_FragColor = vec4(color, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<span class="font-body-md text-body-md text-on-surface">Eliminación agresiva de halos</span>
<div class="relative">
<input class="sr-only" type="checkbox"/>
<div class="block bg-surface-container-high w-10 h-6 rounded-full border border-white/10"></div>
<div class="dot absolute left-1 top-1 bg-outline-variant w-4 h-4 rounded-full transition"></div>
</div>
</label>
</div>
<!-- Action Buttons -->
<div class="mt-auto space-y-3 pt-6">
<button class="w-full py-3 rounded-lg bg-gradient-to-r from-primary-container to-primary text-on-primary-container font-label-md text-label-md shadow-[0_4px_15px_rgba(208,188,255,0.3)] hover:shadow-[0_6px_20px_rgba(208,188,255,0.5)] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">check_circle</span>
                        Guardar y continuar
                    </button>
<button class="w-full py-3 rounded-lg neumorphic-btn text-on-surface-variant font-label-md text-label-md hover:text-on-surface flex items-center justify-center gap-2">
<span class="material-symbols-outlined">close</span>

                    </button>

</main>
<script>
        // Simple toggle visual logic for demonstration
        document.querySelectorAll('input[type="checkbox"]').forEach(toggle => {
            toggle.addEventListener('change', function() {
                const dot = this.parentElement.querySelector('.dot');
                if(this.checked) {
                    dot.classList.add('translate-x-4', 'bg-primary', 'shadow-[0_0_8px_rgba(208,188,255,0.6)]');
                    dot.classList.remove('bg-outline-variant');
                } else {
                    dot.classList.remove('translate-x-4', 'bg-primary', 'shadow-[0_0_8px_rgba(208,188,255,0.6)]');
                    dot.classList.add('bg-outline-variant');
                }
            });
        });

        // Simulate status change
        setTimeout(() => {
            const statusText = document.querySelector('.absolute.bottom-4 .text-label-sm');
            const statusIcon = document.querySelector('.absolute.bottom-4 .material-symbols-outlined');
            if(statusText && statusIcon) {
                statusText.textContent = 'Detectando fondo...';
                setTimeout(() => {
                    statusText.textContent = 'Proceso completado';
                    statusIcon.textContent = 'check';
                    statusIcon.classList.remove('animate-pulse');
                    statusIcon.classList.add('text-primary');
                }, 2000);
            }
        }, 2000);
    </script>
