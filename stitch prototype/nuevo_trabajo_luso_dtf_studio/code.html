<style>
        body {
            background-color: #0b1326;
            background-image: 
                radial-gradient(at 0% 0%, rgba(208, 188, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(76, 215, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #dbe2fd;
        }

        /* Neumorphic Utilities */
        .neu-pressed {
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.6), inset -1px -1px 3px rgba(255,255,255,0.03);
            background: #0b1326;
        }
        
        .neu-raised {
            box-shadow: -1px -1px 3px rgba(255,255,255,0.03), 2px 2px 5px rgba(0,0,0,0.6);
        }

        .glass-panel {
            background: rgba(11, 19, 38, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.1);
            border-left: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

<body class="min-h-screen flex flex-col md:flex-row overflow-x-hidden antialiased">
<!-- Ambient Background Animation (CSS simulated mesh gradient) -->
<div class="fixed inset-0 pointer-events-none -z-10 opacity-30">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary-container blur-[100px] mix-blend-screen animate-pulse" style="animation-duration: 8s;"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary blur-[120px] mix-blend-screen animate-pulse" style="animation-duration: 12s; animation-delay: 2s;"></div>
</div>
<!-- MAIN CANVAS -->
<main class="flex-1 w-full max-w-7xl mx-auto px-4 md:px-container-margin py-8 md:py-12 relative z-0 flex items-center justify-center min-h-screen">
<!-- Floating Workspace Form Container -->
<div class="glass-panel w-full max-w-2xl rounded-xl p-panel-padding md:p-8 flex flex-col gap-element-gap relative">
<!-- Header Section -->
<div class="border-b border-white/5 pb-4 mb-2 flex items-center gap-4">
<div class="w-12 h-12 rounded-lg neu-raised flex items-center justify-center bg-surface-container-high/50 text-secondary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
</div>
<div>
<h1 class="font-headline-lg text-headline-lg md:font-display-xl md:text-display-xl text-primary font-bold tracking-tight">Crear nuevo trabajo</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Configure los detalles básicos para la nueva orden de producción.</p>
</div>
</div>
<!-- Form Content -->
<form class="flex flex-col gap-6">
<!-- Inputs Section -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="nombre">Nombre del trabajo *</label>
<input class="w-full h-12 rounded-lg neu-pressed border-none text-on-surface placeholder:text-on-surface-variant focus:ring-1 focus:ring-secondary focus:outline-none px-4 font-body-md caret-secondary transition-shadow" id="nombre" name="nombre" placeholder="Ej. Lote Camisetas Verano" required="" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="referencia">Referencia <span class="text-on-surface-variant/50 font-normal">(opcional)</span></label>
<input class="w-full h-12 rounded-lg neu-pressed border-none text-on-surface placeholder:text-on-surface-variant focus:ring-1 focus:ring-secondary focus:outline-none px-4 font-body-md caret-secondary transition-shadow" id="referencia" name="referencia" placeholder="Ej. REF-2023-08" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="notas">Notas</label>
<textarea class="w-full rounded-lg neu-pressed border-none text-on-surface placeholder:text-on-surface-variant focus:ring-1 focus:ring-secondary focus:outline-none p-4 font-body-md caret-secondary resize-none transition-shadow" id="notas" name="notas" placeholder="Instrucciones especiales, urgencias, etc." rows="3"></textarea>
</div>
<!-- Profile Selector (Bento Style Cards) -->
<div class="flex flex-col gap-3 mt-2">
<label class="font-label-md text-label-md text-on-surface mb-1">Perfil de Producción *</label>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<!-- Profile Card 1: DTF 58 cm (Active State Simulation) -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="perfil" type="radio" value="dtf-58"/>
<div class="h-full rounded-lg glass-panel p-4 flex flex-col gap-2 border border-transparent peer-checked:border-secondary peer-checked:bg-secondary/10 transition-all duration-300 peer-checked:shadow-[0_0_20px_rgba(76,215,246,0.15)] hover:bg-white/5">
<div class="flex justify-between items-start">
<div class="flex items-center gap-2 text-secondary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">layers</span>
<span class="font-headline-md text-headline-md font-bold">DTF 58 cm</span>
</div>
<div class="w-5 h-5 rounded-full border border-on-surface-variant flex items-center justify-center peer-checked:border-secondary peer-checked:bg-secondary">
<!-- Checked indicator pip -->
<div class="w-2.5 h-2.5 rounded-full bg-surface hidden peer-checked:block"></div>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-1">Ancho máximo de impresión: 580mm. Recomendado para tiradas largas.</p>
<div class="mt-auto pt-2 flex gap-2">
<span class="px-2 py-1 rounded-full bg-surface-container-highest text-xs font-label-sm text-on-surface">Alta Resolución</span>
</div>
</div>
</label>
<!-- Profile Card 2: DTF 50 cm -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="perfil" type="radio" value="dtf-50"/>
<div class="h-full rounded-lg glass-panel p-4 flex flex-col gap-2 border border-transparent peer-checked:border-secondary peer-checked:bg-secondary/10 transition-all duration-300 hover:bg-white/5">
<div class="flex justify-between items-start">
<div class="flex items-center gap-2 text-on-surface group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">layers</span>
<span class="font-headline-md text-headline-md font-bold">DTF 50 cm</span>
</div>
<div class="w-5 h-5 rounded-full border border-on-surface-variant flex items-center justify-center">
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-1">Ancho estándar: 500mm. Ideal para trabajos pequeños y muestras.</p>
</div>
</label>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row justify-end items-center gap-4 mt-6 pt-4 border-t border-white/5">
<button class="w-full sm:w-auto px-6 py-3 rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-white/5 transition-colors focus:outline-none focus:ring-1 focus:ring-primary/50" type="button">
                        Cancelar
                    </button>
<button class="w-full sm:w-auto px-8 py-3 rounded-lg neu-raised bg-primary/10 text-primary font-label-md text-label-md font-bold hover:bg-primary/20 hover:shadow-[0_0_15px_rgba(208,188,255,0.3)] transition-all duration-300 focus:outline-none focus:ring-1 focus:ring-primary flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined text-sm">done</span>
                        Crear trabajo
                    </button>
</div>
</form>
</div>
</main>
<script>
        // Simple script to handle custom radio button UI logic if needed, 
        // though CSS peer-checked handles most of it elegantly.
        document.querySelectorAll('input[name="perfil"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Remove active styling from all inner indicator pips
                document.querySelectorAll('input[name="perfil"] ~ div .w-5.h-5').forEach(pip => {
                    pip.classList.remove('border-secondary', 'bg-secondary');
                    pip.classList.add('border-on-surface-variant');
                    const innerDot = pip.querySelector('div');
                    if(innerDot) innerDot.classList.add('hidden');
                });
                
                // Add to newly selected
                if(e.target.checked) {
                    const pipContainer = e.target.nextElementSibling.querySelector('.w-5.h-5');
                    if(pipContainer) {
                        pipContainer.classList.remove('border-on-surface-variant');
                        pipContainer.classList.add('border-secondary', 'bg-secondary');
                        const innerDot = pipContainer.querySelector('div');
                        if(innerDot) innerDot.classList.remove('hidden');
                    }
                }
            });
        });
    </script>
</body></html>
